version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mrsix-backend
    env_file:
      - .env
    environment:
      - APP_NAME=MR.SIX
      - MISTER_6_ACCESS_POLICY=unrestricted
      - MISTER_6_ALLOW_FILE_INSPECTION=true
      - MISTER_6_ALLOW_SYSTEM_CHECKS=true
      - MISTER_6_ALLOW_DATA_ACCESS=true
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mrsix-network
    volumes:
      - ./backend:/app
      - backend-logs:/var/log/mrsix

  db:
    image: postgres:15-alpine
    container_name: mrsix-db
    environment:
      POSTGRES_USER: mrsix
      POSTGRES_PASSWORD: mrsix_password
      POSTGRES_DB: mrsix_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrsix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mrsix-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    container_name: mrsix-cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mrsix-network
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:alpine
    container_name: mrsix-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mrsix-network

networks:
  mrsix-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  backend-logs:
