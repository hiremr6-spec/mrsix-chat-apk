version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: mrsix-backend:latest
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - mrsix-network
    deploy:
      replicas: ${REPLICAS:-3}
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  db:
    image: postgres:15-alpine
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${DB_USER:-mrsix}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mrsix_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mrsix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - mrsix-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  cache:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - mrsix-network
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
    restart: always
    networks:
      - mrsix-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  mrsix-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
