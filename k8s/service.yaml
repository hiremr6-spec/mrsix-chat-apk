apiVersion: v1
kind: Service
metadata:
  name: mrsix-backend
  namespace: mrsix
  labels:
    app: mrsix-backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: mrsix-backend
---
apiVersion: v1
kind: Service
metadata:
  name: mrsix-backend-lb
  namespace: mrsix
  labels:
    app: mrsix-backend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: mrsix-backend
